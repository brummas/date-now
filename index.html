<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink Candy - Custom Colors Daily Card</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bonbon&family=Cabin+Sketch:wght@400;700&family=Caveat:wght@500;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Dancing+Script:wght@600&family=Flavors&family=Gaegu:wght@400;700&family=Griffy&family=IM+Fell+DW+Pica+SC&family=Jacquarda+12+Charted&family=Jacquarda+Bastarda+9&family=Jacquarda+Bastarda+9+Charted&family=Mystery+Quest&family=Poppins:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Rubik+Burned&family=Rubik+Glitch&family=Sour+Gummy:ital,wght@0,100..900;1,100..900&family=Special+Elite&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            background-color: transparent;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* CONTAINER EXTERNO: Borda de fora (Cor clara/Fundo) */
        .calendar-container {
            background-color: #fff5f7; /* Cor de fundo/borda externa */
            border-radius: 20px;
            padding: 6px; /* Espessura da borda externa */
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            box-shadow: 0 8px 16px -4px rgba(229, 115, 153, 0.15);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* CONTAINER INTERNO: Borda de dentro (Cor Escura) + Área do Conteúdo */
        .inner-container {
            background-color: #fff5f7; /* Cor interna onde fica o texto */
            border: 4px solid #e57399; /* Borda escura interna instalada aqui */
            border-radius: 15px; 
            width: 100%;
            height: 100%;
            padding: 5px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }

        /* Estrela de Configurações posicionada de forma discreta */
        .icon-menu {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 10;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.3;
            transition: opacity 0.2s, transform 0.2s;
        }

        .icon-btn svg {
            fill: #e57399; 
            width: 14px;
            height: 14px;
            transition: fill 0.2s;
        }

        .icon-btn:hover { opacity: 1; transform: scale(1.1); }

        /* Estrutura do Texto Compacta */
        .date-card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            white-space: nowrap; /* Impede quebras feias de texto ao reduzir a largura */
        }

        .date-year {
            font-family: "Sour Gummy", sans-serif;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
            margin: 0;
            color: #f3a0bb;
            line-height: 1.1;
        }

        .date-month {
            font-family: "Gaegu", cursive;
            font-size: 22px;
            font-weight: 700;
            text-transform: lowercase;
            margin: 1px 0;
            color: #e57399;
            line-height: 1.1;
        }

        .date-day {
            font-family: "Sour Gummy", sans-serif;
            font-size: 54px; 
            font-weight: 800;
            line-height: 0.85;
            margin: 0;
            color: #e57399;
        }

        /* Painel de Configurações Dinâmico */
        .settings-panel {
            display: none; 
            background-color: #fff5f7;
            border-radius: 12px;
            padding: 12px;
            border: 2px solid #e57399;
            position: absolute;
            bottom: 5px;
            left: 5px;
            right: 5px;
            max-height: 95%;
            overflow-y: auto;
            flex-direction: column;
            gap: 8px;
            z-index: 20;
            box-shadow: 0px 4px 15px rgba(229, 115, 153, 0.2);
            animation: fadeIn 0.15s ease-in-out;
        }

        .settings-row {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .settings-label-block {
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-size: 11px;
            color: #e57399;
            flex-grow: 1;
        }

        .settings-panel select, .settings-panel input[type="color"] {
            background-color: #fff;
            border: 1px solid #f3a0bb;
            border-radius: 6px;
            padding: 4px;
            font-size: 11px;
            color: #e57399;
            outline: none;
            width: 100%;
        }

        .settings-panel select { cursor: pointer; }
        
        .colors-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(55px, 1fr));
            gap: 6px;
            width: 100%;
        }
        .color-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .color-label { 
            font-size: 10px; 
            color: #e57399; 
            text-align: center;
        }
        .settings-panel input[type="color"] { padding: 1px; height: 26px; cursor: pointer; }
        
        .style-btn-group { display: flex; gap: 4px; }
        .style-btn {
            background-color: #fff;
            border: 1px solid #f3a0bb;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 11px;
            cursor: pointer;
            font-weight: bold;
            color: #e57399;
        }
        .style-btn.active { background-color: #e57399; color: #fff; }

        .ok-btn {
            background-color: #e57399;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 14px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .ok-btn:hover { background-color: #cc5a80; }

        #copy-input { position: absolute; left: -9999px; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(3px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="calendar-card" class="calendar-container">
        <div class="inner-container" id="inner-bg">
            
            <div class="icon-menu">
                <button class="icon-btn" onclick="togglePanel(event)" title="Configurações">
                    <svg viewBox="0 0 24 24">
                        <path id="star-icon" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
                    </svg>
                </button>
            </div>

            <div class="date-card" id="date-card-element">
                <div class="date-year" id="year-output"></div>
                <div class="date-month" id="month-output"></div>
                <div class="date-day" id="day-output"></div>
            </div>

            <div class="settings-panel" id="settings" onclick="event.stopPropagation()">
                
                <div class="settings-row">
                    <div class="settings-label-block" style="flex-grow: 2;">
                        <span>Fonte</span>
                        <select id="font-select" onchange="changeFont(this.value)">
                            <option value="original">Estilo Original (Pink Mix)</option>
                            <option value="'Gaegu', cursive">Gaegu</option>
                            <option value="'Sour Gummy', sans-serif">Sour Gummy</option>
                            <option value="'Playfair Display', serif">Playfair Display</option>
                            <option value="'Mystery Quest', cursive">Mystery Quest</option>
                            <option value="'Flavors', cursive">Flavors</option>
                            <option value="'Cabin Sketch', cursive">Cabin Sketch</option>
                            <option value="'Griffy', cursive">Griffy</option>
                            <option value="'Bonbon', cursive">Bonbon</option>
                            <option value="'Special Elite', monospace">Special Elite</option>
                            <option value="'IM Fell DW Pica SC', serif">IM Fell DW Pica SC</option>
                            <option value="'Rubik Glitch', system-ui">Rubik Glitch</option>
                            <option value="'Rubik Burned', system-ui">Rubik Burned</option>
                            <option value="'Jacquarda Bastarda 9 Charted', serif">Jacquarda Bastarda 9 Charted</option>
                            <option value="'Jacquarda 12 Charted', serif">Jacquarda 12 Charted</option>
                            <option value="'Jacquarda Bastarda 9', serif">Jacquarda Bastarda 9</option>
                            <option value="'Courier Prime', monospace">Courier Prime</option>
                            <option value="'Dancing Script', cursive">Dancing Script</option>
                            <option value="'Caveat', cursive">Caveat</option>
                            <option value="'Poppins', sans-serif">Poppins</option>
                        </select>
                    </div>

                    <div class="settings-label-block">
                        <span>Tam. Geral</span>
                        <select id="size-select" onchange="changeSize()">
                            <option value="10px">Micro</option>
                            <option value="12px">Mini</option>
                            <option value="15px">Pequeno</option>
                            <option value="18px">Médio</option>
                            <option value="22px" selected>Padrão</option>
                            <option value="26px">Intermediário</option>
                            <option value="30px">Grande</option>
                            <option value="36px">Extra G.</option>
                            <option value="42px">Super G.</option>
                            <option value="48px">Megalodonte</option>
                        </select>
                    </div>

                    <div class="settings-label-block">
                        <span>Tam. Dia</span>
                        <select id="day-size-select" onchange="changeSize()">
                            <option value="auto" selected>Proporcional</option>
                            <option value="30px">30px</option>
                            <option value="40px">40px</option>
                            <option value="50px">50px</option>
                            <option value="64px">64px</option>
                            <option value="75px">75px</option>
                            <option value="90px">90px</option>
                            <option value="110px">110px</option>
                            <option value="130px">130px</option>
                        </select>
                    </div>
                </div>

                <div class="settings-row">
                    <div class="settings-label-block">
                        <span>Borda Escura</span>
                        <select id="border-width-select" onchange="changeBorderWidth(this.value)">
                            <option value="0px">Sem borda</option>
                            <option value="1px">1px</option>
                            <option value="2px">2px</option>
                            <option value="3px">3px</option>
                            <option value="4px" selected>4px (Padrão)</option>
                            <option value="5px">5px</option>
                            <option value="6px">6px</option>
                            <option value="8px">8px</option>
                            <option value="10px">10px</option>
                        </select>
                    </div>
                </div>

                <div class="settings-row">
                    <div class="colors-container">
                        <div class="color-group">
                            <span class="color-label">Cor Dia</span>
                            <input type="color" id="day-color-input" value="#e57399" onchange="changeDayColor(this.value)">
                        </div>
                        <div class="color-group">
                            <span class="color-label">Cor Mês</span>
                            <input type="color" id="month-color-input" value="#e57399" onchange="changeMonthColor(this.value)">
                        </div>
                        <div class="color-group">
                            <span class="color-label">Cor Ano</span>
                            <input type="color" id="year-color-input" value="#f3a0bb" onchange="changeYearColor(this.value)">
                        </div>
                        <div class="color-group">
                            <span class="color-label">Borda Int.</span>
                            <input type="color" id="border-color-input" value="#e57399" onchange="changeBorderColor(this.value)">
                        </div>
                        <div class="color-group">
                            <span class="color-label">Fundo Int.</span>
                            <input type="color" id="bg-color-input" value="#fff5f7" onchange="changeBgColor(this.value)">
                        </div>
                        <div class="color-group">
                            <span class="color-label">Cor Ícone</span>
                            <input type="color" id="icon-color-input" value="#e57399" onchange="changeIconColor(this.value)">
                        </div>
                    </div>
                </div>

                <div class="settings-row" style="margin-top: 2px;">
                    <div>
                        <div class="style-btn-group">
                            <button class="style-btn" id="btn-bold" onclick="toggleBold()">B</button>
                            <button class="style-btn" id="btn-italic" onclick="toggleItalic()">I</button>
                            <button class="style-btn" id="btn-normal" onclick="setNormal()">Normal</button>
                        </div>
                    </div>
                    <button class="ok-btn" id="ok-btn-text" onclick="closePanel(event)">OK</button>
                </div>
            </div>

        </div>
    </div>
    
    <input type="text" id="copy-input">

    <script>
        const panel = document.getElementById('settings');
        const mainContainer = document.getElementById('calendar-card');
        const innerBg = document.getElementById('inner-bg');
        const dateCard = document.getElementById('date-card-element');
        
        const yearOutput = document.getElementById('year-output');
        const monthOutput = document.getElementById('month-output');
        const dayOutput = document.getElementById('day-output');
        const starIcon = document.getElementById('star-icon');

        const fontSelect = document.getElementById('font-select');
        const sizeSelect = document.getElementById('size-select');
        const daySizeSelect = document.getElementById('day-size-select');
        const borderWidthSelect = document.getElementById('border-width-select');
        
        const dayColorInput = document.getElementById('day-color-input');
        const monthColorInput = document.getElementById('month-color-input');
        const yearColorInput = document.getElementById('year-color-input');
        const borderColorInput = document.getElementById('border-color-input');
        const bgColorInput = document.getElementById('bg-color-input');
        const iconColorInput = document.getElementById('icon-color-input');
        const okBtnText = document.getElementById('ok-btn-text');

        let isBold = false;
        let isItalic = false; 

        function updateCurrentDate() {
            const hoje = new Date();
            yearOutput.innerText = hoje.getFullYear();
            const meses = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
            monthOutput.innerText = meses[hoje.getMonth()];
            dayOutput.innerText = hoje.getDate();
        }

        function loadUrlSettings() {
            updateCurrentDate();
            const params = new URLSearchParams(window.location.search);
            
            if (params.has('fnt')) {
                const fontVal = params.get('fnt');
                if(fontVal === 'original') {
                    setOriginalFonts();
                } else {
                    dateCard.style.fontFamily = fontVal;
                    yearOutput.style.fontFamily = fontVal;
                    monthOutput.style.fontFamily = fontVal;
                    dayOutput.style.fontFamily = fontVal;
                }
                fontSelect.value = fontVal;
            } else {
                setOriginalFonts();
            }
            
            if (params.has('sz')) sizeSelect.value = params.get('sz');
            if (params.has('dsz')) daySizeSelect.value = params.get('dsz');
            if (params.has('brdW')) {
                borderWidthSelect.value = params.get('brdW');
                innerBg.style.borderWidth = params.get('brdW');
            }
            applySizes();
            
            if (params.has('cDay')) dayOutput.style.color = params.get('cDay');
            if (params.has('cMon')) monthOutput.style.color = params.get('cMon');
            if (params.has('cYr')) yearOutput.style.color = params.get('cYr');
            if (params.has('brd')) innerBg.style.borderColor = params.get('brd');
            if (params.has('cIco')) starIcon.style.fill = params.get('cIco');
            if (params.has('bg')) {
                mainContainer.style.backgroundColor = params.get('bg');
                innerBg.style.backgroundColor = params.get('bg');
                panel.style.backgroundColor = params.get('bg');
            }
            
            if (params.has('bld')) {
                isBold = params.get('bld') === 'true';
                dateCard.style.fontWeight = isBold ? 'bold' : 'normal';
            }
            if (params.has('itl')) {
                isItalic = params.get('itl') === 'true';
                dateCard.style.fontStyle = isItalic ? 'italic' : 'normal';
            }

            dayColorInput.value = rgbToHex(dayOutput.style.color) || "#e57399";
            monthColorInput.value = rgbToHex(monthOutput.style.color) || "#e57399";
            yearColorInput.value = rgbToHex(yearOutput.style.color) || "#f3a0bb";
            borderColorInput.value = rgbToHex(innerBg.style.borderColor) || "#e57399";
            bgColorInput.value = rgbToHex(innerBg.style.backgroundColor) || "#fff5f7";
            iconColorInput.value = rgbToHex(starIcon.style.fill) || "#e57399";
            
            document.getElementById('btn-bold').classList.toggle('active', isBold);
            document.getElementById('btn-italic').classList.toggle('active', isItalic);
        }

        function setOriginalFonts() {
            dateCard.style.fontFamily = "inherit";
            yearOutput.style.fontFamily = '"Sour Gummy", sans-serif';
            monthOutput.style.fontFamily = '"Gaegu", cursive';
            dayOutput.style.fontFamily = '"Sour Gummy", sans-serif';
        }

        function applySizes() {
            const baseSize = parseInt(sizeSelect.value);
            yearOutput.style.fontSize = (baseSize * 0.70) + 'px';
            monthOutput.style.fontSize = (baseSize * 1.05) + 'px';
            
            if(daySizeSelect.value === 'auto') {
                dayOutput.style.fontSize = (baseSize * 2.5) + 'px';
            } else {
                dayOutput.style.fontSize = daySizeSelect.value;
            }
        }

        function generateAndCopyLink() {
            const baseUrl = window.location.protocol + '//' + window.location.host + window.location.pathname;
            const params = new URLSearchParams();
            
            params.set('fnt', fontSelect.value);
            params.set('sz', sizeSelect.value);
            params.set('dsz', daySizeSelect.value);
            params.set('brdW', borderWidthSelect.value);
            params.set('cDay', dayColorInput.value);
            params.set('cMon', monthColorInput.value);
            params.set('cYr', yearColorInput.value);
            params.set('brd', borderColorInput.value);
            params.set('bg', bgColorInput.value);
            params.set('cIco', iconColorInput.value);
            params.set('bld', isBold);
            params.set('itl', isItalic);

            const finalUrl = baseUrl + '?' + params.toString();
            
            const copyInput = document.getElementById('copy-input');
            copyInput.value = finalUrl;
            copyInput.select();
            document.execCommand('copy');

            okBtnText.innerText = "Copiado! 👍";
            setTimeout(() => {
                okBtnText.innerText = "OK";
                panel.style.display = 'none';
            }, 1000);
        }

        function togglePanel(event) {
            event.stopPropagation();
            panel.style.display = (panel.style.display === 'flex') ? 'none' : 'flex';
        }

        function closePanel(event) {
            if (event) event.stopPropagation();
            generateAndCopyLink();
        }

        function changeFont(val) { 
            if(val === 'original') {
                setOriginalFonts();
            } else {
                yearOutput.style.fontFamily = val;
                monthOutput.style.fontFamily = val;
                dayOutput.style.fontFamily = val;
            }
        }
        
        function changeSize() { applySizes(); }
        function changeBorderWidth(val) { innerBg.style.borderWidth = val; }
        
        function changeDayColor(val) { dayOutput.style.color = val; }
        function changeMonthColor(val) { monthOutput.style.color = val; }
        function changeYearColor(val) { yearOutput.style.color = val; }
        function changeBorderColor(val) { innerBg.style.borderColor = val; }
        function changeIconColor(val) { starIcon.style.fill = val; }
        function changeBgColor(val) { mainContainer.style.backgroundColor = val; innerBg.style.backgroundColor = val; panel.style.backgroundColor = val; }

        function toggleBold() {
            isBold = !isBold;
            dateCard.style.fontWeight = isBold ? 'bold' : 'normal';
            document.getElementById('btn-bold').classList.toggle('active', isBold);
        }

        function toggleItalic() {
            isItalic = !isItalic;
            dateCard.style.fontStyle = isItalic ? 'italic' : 'normal';
            document.getElementById('btn-italic').classList.toggle('active', isItalic);
        }

        function setNormal() {
            isBold = false; isItalic = false;
            dateCard.style.fontWeight = 'normal';
            dateCard.style.fontStyle = 'normal';
            document.getElementById('btn-bold').classList.remove('active');
            document.getElementById('btn-italic').classList.remove('active');
        }

        function rgbToHex(rgb) {
            if (!rgb || rgb.indexOf('rgb') === -1) return rgb;
            const rgbValues = rgb.match(/\d+/g);
            const r = parseInt(rgbValues[0]).toString(16).padStart(2, '0');
            const g = parseInt(rgbValues[1]).toString(16).padStart(2, '0');
            const b = parseInt(rgbValues[2]).toString(16).padStart(2, '0');
            return `#${r}${g}${b}`;
        }

        document.addEventListener('click', function(event) {
            if (panel.style.display === 'flex') panel.style.display = 'none';
        });

        window.onload = loadUrlSettings;
    </script>
</body>
</html>
