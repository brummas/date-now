<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakura - Daily Card</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Sour+Gummy:ital,wght@0,100..900;1,100..900&family=Mystery+Quest&family=Flavors&family=Cabin+Sketch:wght@400;700&family=Griffy&family=Bonbon&family=Special+Elite&family=IM+Fell+DW+Pica+SC&family=Rubik+Glitch&family=Rubik+Burned&family=Jacquarda+Bastarda+9+Charted&family=Jacquarda+12+Charted&family=Jacquarda+Bastarda+9&family=Playfair+Display:ital@1&family=Dancing+Script:wght@600&family=Poppins:wght@300;400&family=Caveat:wght@500&family=Courier+Prime&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            background-color: transparent;
            margin: 0;
            padding: 0;
            font-family: 'Gaegu', cursive;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Container 100% flexível para se ajustar ao bloco do Notion */
        .widget-container {
            background-color: #FFF0F5; /* Rosa Pastel Inicial */
            border: 1px outset #b0b0b0; 
            border-radius: 16px;
            padding: 20px; 
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.03);
            text-align: center;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: auto;
        }

        /* Estrela no TOPO ESQUERDO de 33px */
        .icon-menu {
            position: absolute;
            top: 8px;
            left: 8px;
            z-index: 10;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.6;
            transition: opacity 0.2s, transform 0.2s;
        }

        .icon-btn svg {
            fill: #FFB6C1; 
            width: 33px;
            height: 33px;
        }

        .icon-btn:hover { opacity: 1; transform: scale(1.1); }

        /* Estrutura do Cartão de Data (Baseada no Sakura) */
        .date-card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            color: #4A3E3D;
        }

        .date-year {
            font-family: 'Sour Gummy', sans-serif;
            font-size: 18px;
            font-weight: 300;
            margin-bottom: 2px;
            opacity: 0.8;
        }

        .date-month {
            font-family: 'Gaegu', cursive;
            font-size: 24px;
            font-weight: 700;
            text-transform: lowercase;
            margin-bottom: 5px;
        }

        .date-day {
            font-family: 'Sour Gummy', sans-serif;
            font-size: 56px; /* Tamanho maior para o dia */
            font-weight: 900;
            line-height: 1;
        }

        /* Painel de Configurações */
        .settings-panel {
            display: none; 
            background-color: #FFE4E1;
            border-radius: 12px;
            padding: 12px;
            border: 1px solid #FFB6C1;
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            max-height: 85%;
            overflow-y: auto;
            flex-direction: column;
            gap: 8px;
            z-index: 20;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
            animation: fadeIn 0.2s ease-in-out;
        }

        .settings-row {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .settings-panel select, .settings-panel input[type="color"] {
            background-color: #fff;
            border: 1px solid #FFB6C1;
            border-radius: 6px;
            padding: 5px;
            font-size: 12px;
            cursor: pointer;
            outline: none;
            flex-grow: 1;
        }
        
        .color-group { display: flex; gap: 4px; align-items: center; }
        .color-label { font-size: 10px; color: #5c4d4c; display: flex; flex-direction: column; align-items: center; }
        .settings-panel input[type="color"] { padding: 2px; height: 28px; width: 40px; flex-grow: 0; }
        .style-btn-group { display: flex; gap: 4px; }

        .style-btn {
            background-color: #fff;
            border: 1px solid #FFB6C1;
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
            color: #4A3E3D;
        }

        .style-btn.active { background-color: #FFB6C1; color: #fff; }

        .ok-btn {
            background-color: #FFB6C1;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .ok-btn:hover { background-color: #FFA07A; }

        #copy-input { position: absolute; left: -9999px; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="widget-container" id="widget-bg">
        <div class="icon-menu">
            <button class="icon-btn" onclick="togglePanel(event)" title="Configurações">
                <svg viewBox="0 0 24 24">
                    <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
                </svg>
            </button>
        </div>

        <div class="date-card" id="date-card-element">
            <div class="date-year" id="year-output"></div>
            <div class="date-month" id="month-output"></div>
            <div class="date-day" id="day-output"></div>
        </div>

        <div class="settings-panel" id="settings" onclick="event.stopPropagation()">
            <div class="settings-row">
                <select id="font-select" onchange="changeFont(this.value)">
                    <option value="'Gaegu', cursive">Gaegu</option>
                    <option value="'Sour Gummy', sans-serif">Sour Gummy</option>
                    <option value="'Playfair Display', serif">Playfair Display</option>
                    <option value="'Mystery Quest', cursive">Mystery Quest</option>
                    <option value="'Flavors', cursive">Flavors</option>
                    <option value="'Cabin Sketch', cursive">Cabin Sketch</option>
                    <option value="'Griffy', cursive">Griffy</option>
                    <option value="'Bonbon', cursive">Bonbon</option>
                    <option value="'Special Elite', monospace">Special Elite</option>
                    <option value="'IM Fell DW Pica SC', serif">IM Fell DW Pica SC</option>
                    <option value="'Rubik Glitch', system-ui">Rubik Glitch</option>
                    <option value="'Rubik Burned', system-ui">Rubik Burned</option>
                    <option value="'Jacquarda Bastarda 9 Charted', serif">Jacquarda Bastarda 9 Charted</option>
                    <option value="'Jacquarda 12 Charted', serif">Jacquarda 12 Charted</option>
                    <option value="'Jacquarda Bastarda 9', serif">Jacquarda Bastarda 9</option>
                    <option value="'Courier Prime', monospace">Courier Prime</option>
                    <option value="'Dancing Script', cursive">Dancing Script</option>
                    <option value="'Caveat', cursive">Caveat</option>
                    <option value="'Poppins', sans-serif">Poppins</option>
                </select>

                <select id="size-select" onchange="changeSize(this.value)" style="max-width: 85px;">
                    <option value="14px">Pequeno</option>
                    <option value="18px">Médio</option>
                    <option value="22px" selected>Padrão</option>
                    <option value="28px">Grande</option>
                    <option value="36px">Extra G.</option>
                </select>
            </div>

            <div class="settings-row">
                <div class="color-group">
                    <label class="color-label">Texto<input type="color" id="color-input" value="#4A3E3D" onchange="changeColor(this.value)"></label>
                </div>
                <div class="color-group">
                    <label class="color-label">Fundo<input type="color" id="bg-color-input" value="#FFF0F5" onchange="changeBgColor(this.value)"></label>
                </div>
                <div class="color-group">
                    <label class="color-label">Borda<input type="color" id="border-color-input" value="#b0b0b0" onchange="changeBorderColor(this.value)"></label>
                </div>
            </div>

            <div class="settings-row" style="margin-top: 2px;">
                <div>
                    <span style="font-size: 11px; color: #5c4d4c; margin-right: 4px;">Estilo:</span>
                    <div class="style-btn-group" style="display: inline-flex;">
                        <button class="style-btn" id="btn-bold" onclick="toggleBold()">B</button>
                        <button class="style-btn" id="btn-italic" onclick="toggleItalic()">I</button>
                        <button class="style-btn" id="btn-normal" onclick="setNormal()">Normal</button>
                    </div>
                </div>
                <button class="ok-btn" id="ok-btn-text" onclick="closePanel(event)">OK</button>
            </div>
        </div>
    </div>
    
    <input type="text" id="copy-input">

    <script>
        const panel = document.getElementById('settings');
        const widgetBg = document.getElementById('widget-bg');
        const dateCard = document.getElementById('date-card-element');
        
        const yearOutput = document.getElementById('year-output');
        const monthOutput = document.getElementById('month-output');
        const dayOutput = document.getElementById('day-output');

        const fontSelect = document.getElementById('font-select');
        const sizeSelect = document.getElementById('size-select');
        const colorInput = document.getElementById('color-input');
        const bgColorInput = document.getElementById('bg-color-input');
        const borderColorInput = document.getElementById('border-color-input');
        const okBtnText = document.getElementById('ok-btn-text');

        let isBold = false;
        let isItalic = false; 

        // Atualização automática da Data de Hoje em Português
        function updateCurrentDate() {
            const hoje = new Date();
            
            // Ano (Ex: 2026)
            yearOutput.innerText = hoje.getFullYear();
            
            // Mês por extenso em português (Ex: junho)
            const meses = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
            monthOutput.innerText = meses[hoje.getMonth()];
            
            // Dia (Ex: 20)
            dayOutput.innerText = hoje.getDate();
        }

        // Carrega configurações passadas pela URL
        function loadUrlSettings() {
            updateCurrentDate();
            const params = new URLSearchParams(window.location.search);
            
            if (params.has('fnt')) dateCard.style.fontFamily = params.get('fnt');
            if (params.has('sz')) {
                const baseSize = parseInt(params.get('sz'));
                yearOutput.style.fontSize = (baseSize * 0.8) + 'px';
                monthOutput.style.fontSize = (baseSize * 1.1) + 'px';
                dayOutput.style.fontSize = (baseSize * 2.5) + 'px';
                sizeSelect.value = params.get('sz');
            } else {
                // Padrão inicial proporcional
                changeSize("22px");
            }
            
            if (params.has('col')) dateCard.style.color = params.get('col');
            if (params.has('bg')) widgetBg.style.backgroundColor = params.get('bg');
            if (params.has('brd')) widgetBg.style.borderColor = params.get('brd');
            
            if (params.has('bld')) {
                isBold = params.get('bld') === 'true';
                dateCard.style.fontWeight = isBold ? 'bold' : 'normal';
            }
            if (params.has('itl')) {
                isItalic = params.get('itl') === 'true';
                dateCard.style.fontStyle = isItalic ? 'italic' : 'normal';
            }

            fontSelect.value = dateCard.style.fontFamily || "'Gaegu', cursive";
            colorInput.value = rgbToHex(dateCard.style.color) || "#4A3E3D";
            bgColorInput.value = rgbToHex(widgetBg.style.backgroundColor) || "#FFF0F5";
            borderColorInput.value = rgbToHex(widgetBg.style.borderColor) || "#b0b0b0";
            
            document.getElementById('btn-bold').classList.toggle('active', isBold);
            document.getElementById('btn-italic').classList.toggle('active', isItalic);
            if (!isBold && !isItalic) document.getElementById('btn-normal').classList.add('active');
        }

        function generateAndCopyLink() {
            const baseUrl = window.location.protocol + '//' + window.location.host + window.location.pathname;
            const params = new URLSearchParams();
            
            params.set('fnt', fontSelect.value);
            params.set('sz', sizeSelect.value);
            params.set('col', colorInput.value);
            params.set('bg', bgColorInput.value);
            params.set('brd', borderColorInput.value);
            params.set('bld', isBold);
            params.set('itl', isItalic);

            const finalUrl = baseUrl + '?' + params.toString();
            
            const copyInput = document.getElementById('copy-input');
            copyInput.value = finalUrl;
            copyInput.select();
            copyInput.setSelectionRange(0, 99999);
            document.execCommand('copy');

            okBtnText.innerText = "Copiado! 👍";
            setTimeout(() => {
                okBtnText.innerText = "OK";
                panel.style.display = 'none';
            }, 1000);
        }

        function togglePanel(event) {
            event.stopPropagation();
            if (panel.style.display === 'flex') {
                panel.style.display = 'none';
            } else {
                panel.style.display = 'flex';
            }
        }

        function closePanel(event) {
            if (event) event.stopPropagation();
            generateAndCopyLink();
        }

        function changeFont(val) { dateCard.style.fontFamily = val; }
        
        function changeSize(val) {
            const baseSize = parseInt(val);
            yearOutput.style.fontSize = (baseSize * 0.8) + 'px';
            monthOutput.style.fontSize = (baseSize * 1.1) + 'px';
            dayOutput.style.fontSize = (baseSize * 2.5) + 'px';
        }
        
        function changeColor(val) { dateCard.style.color = val; }
        function changeBgColor(val) { widgetBg.style.backgroundColor = val; }
        function changeBorderColor(val) { widgetBg.style.borderColor = val; }

        function toggleBold() {
            isBold = !isBold;
            dateCard.style.fontWeight = isBold ? 'bold' : 'normal';
            document.getElementById('btn-bold').classList.toggle('active', isBold);
            if(isBold) document.getElementById('btn-normal').classList.remove('active');
        }

        function toggleItalic() {
            isItalic = !isItalic;
            dateCard.style.fontStyle = isItalic ? 'italic' : 'normal';
            document.getElementById('btn-italic').classList.toggle('active', isItalic);
            if(isItalic) document.getElementById('btn-normal').classList.remove('active');
        }

        function setNormal() {
            isBold = false; isItalic = false;
            dateCard.style.fontWeight = 'normal';
            dateCard.style.fontStyle = 'normal';
            document.getElementById('btn-bold').classList.remove('active');
            document.getElementById('btn-italic').classList.remove('active');
            document.getElementById('btn-normal').classList.add('active');
        }

        function rgbToHex(rgb) {
            if (!rgb || rgb.indexOf('rgb') === -1) return rgb;
            const rgbValues = rgb.match(/\d+/g);
            const r = parseInt(rgbValues[0]).toString(16).padStart(2, '0');
            const g = parseInt(rgbValues[1]).toString(16).padStart(2, '0');
            const b = parseInt(rgbValues[2]).toString(16).padStart(2, '0');
            return `#${r}${g}${b}`;
        }

        document.addEventListener('click', function(event) {
            if (panel.style.display === 'flex') {
                panel.style.display = 'none';
            }
        });

        window.onload = loadUrlSettings;
    </script>
</body>
</html>
