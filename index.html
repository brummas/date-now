<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink Candy - Custom Colors Daily Card</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bonbon&family=Cabin+Sketch:wght@400;700&family=Caveat:wght@500;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Dancing+Script:wght@600&family=Flavors&family=Gaegu:wght@400;700&family=Griffy&family=IM+Fell+DW+Pica+SC&family=Jacquarda+12+Charted&family=Jacquarda+Bastarda+9&family=Jacquarda+Bastarda+9+Charted&family=Mystery+Quest&family=Poppins:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Rubik+Burned&family=Rubik+Glitch&family=Sour+Gummy:ital,wght@0,100..900;1,100..900&family=Special+Elite&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            background-color: transparent;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* CONTAINER EXTERNO: Borda Externa Clara + Força o aspecto 1:1 (Quadrado) */
        .calendar-container {
            background-color: #fff5f7; 
            border-radius: 20px;
            padding: 4px; 
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 100vh;
            aspect-ratio: 1 / 1; 
            box-shadow: 0 8px 16px -4px rgba(229, 115, 153, 0.15);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* CONTAINER INTERNO: Borda Escura Interna */
        .inner-container {
            background-color: #fff5f7; 
            border: 4px solid #e57399; 
            border-radius: 16px; 
            width: 100%;
            height: 100%;
            padding: 4px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }

        /* Ícone de configurações */
        .icon-menu {
            position: absolute;
            top: 8px;
            left: 8px;
            z-index: 10;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.15;
            transition: opacity 0.2s;
        }

        .icon-btn svg {
            fill: #e57399; 
            width: 12px;
            height: 12px;
        }

        .icon-btn:hover { opacity: 1; }

        /* Estrutura de Texto Responsiva Dinâmica Baseada em vmin */
        .date-card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            white-space: nowrap;
        }

        .date-year {
            font-family: "Sour Gummy", sans-serif;
            font-size: clamp(10px, 6vmin, 18px);
            font-weight: 500;
            letter-spacing: 1px;
            margin: 0;
            color: #f3a0bb;
            line-height: 1.1;
        }

        .date-month {
            font-family: "Gaegu", cursive;
            font-size: clamp(13px, 9vmin, 26px);
            font-weight: 700;
            text-transform: lowercase;
            margin: 1px 0;
            color: #e57399;
            line-height: 1.1;
        }

        .date-day {
            font-family: "Sour Gummy", sans-serif;
            font-size: clamp(26px, 24vmin, 70px); 
            font-weight: 800;
            line-height: 0.85;
            margin: 0;
            color: #e57399;
        }

        /* Painel de Configurações */
        .settings-panel {
            display: none; 
            background-color: #fff5f7;
            border-radius: 12px;
            padding: 10px;
            border: 2px solid #e57399;
            position: absolute;
            bottom: 4px;
            left: 4px;
            right: 4px;
            max-height: 95%;
            overflow-y: auto;
            flex-direction: column;
            gap: 6px;
            z-index: 20;
            box-shadow: 0px 4px 15px rgba(229, 115, 153, 0.2);
        }

        .settings-row {
            display: flex;
            gap: 4px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .settings-label-block {
            display: flex;
            flex-direction: column;
            gap: 1px;
            font-size: 10px;
            color: #e57399;
            flex-grow: 1;
        }

        .settings-panel select, .settings-panel input[type="color"] {
            background-color: #fff;
            border: 1px solid #f3a0bb;
            border-radius: 5px;
            padding: 3px;
            font-size: 10px;
            color: #e57399;
            outline: none;
            width: 100%;
        }
        
        .colors-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(50px, 1fr));
            gap: 4px;
            width: 100%;
        }
        .color-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
        }
        .color-label { font-size: 9px; color: #e57399; text-align: center;}
        .settings-panel input[type="color"] { padding: 1px; height: 22px; cursor: pointer; }
        
        .style-btn-group { display: flex; gap: 3px; }
        .style-btn {
            background-color: #fff;
            border: 1px solid #f3a0bb;
            border-radius: 5px;
            padding: 3px 6px;
            font-size: 10px;
            cursor: pointer;
            font-weight: bold;
            color: #e57399;
        }
        .style-btn.active { background-color: #e57399; color: #fff; }

        .ok-btn {
            background-color: #e57399;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 4px 10px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        #copy-input { position: absolute; left: -9999px; }
    </style>
</head>
